map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}
map $uri $referrer_policy {
    default strict-origin-when-cross-origin;
    /api/social/x/callback no-referrer;
}
server {
    listen 3187;
    server_name _;
    server_tokens off;
    client_max_body_size 3m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header OAI-Authenticated-User-Id "";
    proxy_set_header OAI-Authenticated-User-Email "";
    proxy_buffering off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy $referrer_policy always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self'; connect-src 'self' https:; frame-src 'self' https://www.gmgn.cc; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location ^~ /api/internal/ { return 404; }
    location = /api/social/x/callback {
        access_log off;
        proxy_pass $frontend;
        proxy_read_timeout 180s;
    }
    location ~ ^/(?:assets|_next/static|models|fonts)/ {
        proxy_pass $frontend;
        proxy_buffering on;
        proxy_hide_header Cache-Control;
        expires 7d;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 512;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
    }
    location /api/ {
        proxy_pass $frontend;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    location / { proxy_pass $frontend; }
}
